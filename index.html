<script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;
const ADMIN_EMAIL = "agenciaindm@gmail.com";
const PIX_CHAVE   = "06981774950";
const MESES_NOME  = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
const MESES_ABREV = ["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];

const STATUS = {
  em_projeto:           {label:"Em Projeto",   icon:"✏️",color:"#92400E",bg:"#FEF3C7",border:"#F59E0B"},
  na_fabrica:           {label:"Na Fábrica",    icon:"🏭",color:"#065F46",bg:"#D1FAE5",border:"#10B981"},
  aguardando_pagamento: {label:"Ag. Pagamento", icon:"💰",color:"#991B1B",bg:"#FEE2E2",border:"#EF4444"},
  concluido:            {label:"Concluído",     icon:"✅",color:"#1E3A5F",bg:"#DBEAFE",border:"#3B82F6"},
};

const PRAZO = (prazo) => {
  const d = Math.ceil((new Date(prazo) - new Date()) / 86400000);
  if (d < 0)   return {d,icon:"🚨",label:`${Math.abs(d)}d atrasado`,color:"#fff",   bg:"#DC2626",border:"#991B1B",pulse:"red"};
  if (d === 0) return {d,icon:"🔴",label:"Vence HOJE",              color:"#fff",   bg:"#DC2626",border:"#991B1B",pulse:"red"};
  if (d <= 3)  return {d,icon:"🟠",label:`${d}d restantes`,         color:"#fff",   bg:"#D97706",border:"#B45309",pulse:"orange"};
  if (d <= 7)  return {d,icon:"🟡",label:`${d}d restantes`,         color:"#92400E",bg:"#FEF3C7",border:"#F59E0B",pulse:null};
  if (d <= 14) return {d,icon:"🟢",label:`${d}d restantes`,         color:"#065F46",bg:"#D1FAE5",border:"#10B981",pulse:null};
  return             {d,icon:"📅",label:`${d}d restantes`,          color:"#374151",bg:"#F3F4F6",border:"#D1D5DB",pulse:null};
};

const TIPOS_AGENDA = {
  medicao:    {label:"Medição",    icon:"📐",color:"#1D4ED8",bg:"#DBEAFE",border:"#3B82F6"},
  entrega:    {label:"Entrega",    icon:"🚚",color:"#065F46",bg:"#D1FAE5",border:"#10B981"},
  instalacao: {label:"Instalação", icon:"🔧",color:"#92400E",bg:"#FEF3C7",border:"#F59E0B"},
  outro:      {label:"Outro",      icon:"📌",color:"#374151",bg:"#F3F4F6",border:"#D1D5DB"},
};

const R$ = (v) => Number(v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const DD  = (s) => { if(!s) return "—"; const [y,m,d]=s.split("-"); return `${d}/${m}/${y}`; };

const Spin = () => <div style={{width:18,height:18,border:"2px solid rgba(255,255,255,.4)",borderTopColor:"#fff",borderRadius:"50%",animation:"spin .6s linear infinite",display:"inline-block"}}/>;

const Badge = ({st}) => (
  <span style={{display:"inline-flex",alignItems:"center",gap:4,padding:"3px 10px",borderRadius:20,fontSize:11,fontWeight:700,fontFamily:"'DM Sans',sans-serif",background:st.bg,color:st.color,border:`1.5px solid ${st.border}`}}>{st.icon} {st.label}</span>
);

const PrazoBadge = ({prazo, large}) => {
  const p = PRAZO(prazo);
  return (
    <span className={p.pulse==="red"?"pulse-red":p.pulse==="orange"?"pulse-orange":""}

      {p.icon} {p.label}
    </span>
  );
};

const ProgressBar = ({pct, color}) => (
  <div style={{height:6,background:"#E5E7EB",borderRadius:3,overflow:"hidden"}}>
    <div style={{height:"100%",width:`${Math.min(pct,100)}%`,background:color||(pct>=100?"#10B981":"#2C5F2E"),borderRadius:3,transition:"width .5s ease"}}/>
  </div>
);

// ── AUTH ──────────────────────────────────────────────────────────────────────
function AuthScreen({onLogin}) {
  const [modo,setModo]     = useState("login");
  const [nome,setNome]     = useState("");
  const [email,setEmail]   = useState("");
  const [senha,setSenha]   = useState("");
  const [show,setShow]     = useState(false);
  const [erro,setErro]     = useState("");
  const [load,setLoad]     = useState(false);

  const doLogin = async () => {
    if (!email||!senha) { setErro("Preencha e-mail e senha"); return; }
    setLoad(true); setErro("");
    try {
      const c = await window.__auth.signInWithEmailAndPassword(email.trim(), senha);
      onLogin(c.user);
    } catch(e) {
      setErro(e.code==="auth/wrong-password"||e.code==="auth/user-not-found"||e.code==="auth/invalid-credential"?"E-mail ou senha incorretos":"Erro ao entrar.");
    }
    setLoad(false);
  };

  const doCadastro = async () => {
    if (!nome||!email||!senha) { setErro("Preencha todos os campos"); return; }
    if (senha.length<6) { setErro("Senha mínimo 6 caracteres"); return; }
    setLoad(true); setErro("");
    try {
      const c = await window.__auth.createUserWithEmailAndPassword(email.trim(), senha);
      await c.user.updateProfile({displayName: nome.trim()});
      await window.__db.collection("users").doc(c.user.uid).set({
        nome:nome.trim(), email:email.trim(), projects:[], meta:0, plano:"free", criadoEm:new Date().toISOString()
      });
      onLogin(c.user);
    } catch(e) {
      setErro(e.code==="auth/email-already-in-use"?"E-mail já cadastrado":"Erro ao cadastrar.");
    }
    setLoad(false);
  };

  return (
    <div style={{minHeight:"100vh",background:"linear-gradient(160deg,#1E4020,#2C5F2E,#3A7A3D)",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:24}}>
      <div style={{textAlign:"center",marginBottom:32}}>
        <div style={{width:90,height:90,background:"rgba(255,255,255,.12)",borderRadius:24,display:"flex",alignItems:"center",justifyContent:"center",fontSize:48,margin:"0 auto 16px",border:"2px solid rgba(200,169,122,.4)"}}>🏠</div>
        <div style={{fontFamily:"'Playfair Display',serif",fontSize:34,fontWeight:900,color:"#fff",lineHeight:1}}>Móveis<span style={{color:"#C8A97A"}}>Studio</span></div>
        <div style={{fontSize:12,color:"rgba(255,255,255,.6)",letterSpacing:"3px",textTransform:"uppercase",fontFamily:"'DM Sans',sans-serif",marginTop:6}}>Gestão de Projetos</div>
      </div>
      <div style={{background:"#fff",borderRadius:20,padding:"28px 24px",width:"100%",maxWidth:380,boxShadow:"0 20px 60px rgba(0,0,0,.3)"}}>
        <div style={{display:"flex",marginBottom:24,background:"#F9F7F5",borderRadius:12,padding:4}}>
          {[["login","Entrar"],["cadastro","Criar conta"]].map(([k,l]) => (
            <button key={k} onClick={()=>{setModo(k);setErro("");}} style={{flex:1,padding:9,border:"none",borderRadius:9,cursor:"pointer",fontFamily:"'DM Sans',sans-serif",fontWeight:700,fontSize:14,background:modo===k?"#fff":"transparent",color:modo===k?"#2C5F2E":"#9C8B7D",boxShadow:modo===k?"0 1px 4px rgba(0,0,0,.1)":"none",transition:"all .2s"}}>{l}</button>
          ))}
        </div>
        {modo==="cadastro" && (
          <div style={{marginBottom:16}}><div className="section-label">Seu nome</div><input value={nome} onChange={e=>setNome(e.target.value)} placeholder="Como você se chama"/></div>
        )}
        <div style={{marginBottom:16}}><div className="section-label">E-mail</div><input type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="seu@email.com" autoCapitalize="none" onKeyDown={e=>e.key==="Enter"&&(modo==="login"?doLogin():doCadastro())}/></div>
        <div style={{marginBottom:16}}><div className="section-label">Senha</div>
          <div style={{position:"relative"}}>
            <input type={show?"text":"password"} value={senha} onChange={e=>setSenha(e.target.value)} placeholder="••••••••" style={{paddingRight:48}} onKeyDown={e=>e.key==="Enter"&&(modo==="login"?doLogin():doCadastro())}/>
            <button onClick={()=>setShow(s=>!s)} style={{position:"absolute",right:12,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",cursor:"pointer",fontSize:18,color:"#9C8B7D"}}>{show?"🙈":"👁️"}</button>
          </div>
        </div>
        {erro && <div style={{background:"#FEE2E2",border:"1px solid #FCA5A5",borderRadius:8,padding:"10px 14px",marginBottom:12,fontFamily:"'DM Sans',sans-serif",fontSize:13,color:"#991B1B",textAlign:"center"}}>⚠️ {erro}</div>}
        <button className="btn-green" onClick={modo==="login"?doLogin:doCadastro} disabled={load}>{load?<Spin/>:modo==="login"?"🔐 Entrar":"✅ Criar conta grátis"}</button>
        <div style={{textAlign:"center",marginTop:14,fontFamily:"'DM Sans',sans-serif",fontSize:12,color:"#9C8B7D"}}>
          {modo==="login"?"Não tem conta? ":"Já tem conta? "}
          <button onClick={()=>{setModo(modo==="login"?"cadastro":"login");setErro("");}} style={{background:"none",border:"none",color:"#2C5F2E",fontWeight:700,cursor:"pointer",fontFamily:"'DM Sans',sans-serif",fontSize:12}}>{modo==="login"?"Criar conta grátis":"Entrar"}</button>
        </div>
      </div>
      <div style={{marginTop:20,fontFamily:"'DM Sans',sans-serif",fontSize:11,color:"rgba(255,255,255,.4)"}}>MóveisStudio © 2025</div>
    </div>
  );
}

// ── PLANOS ────────────────────────────────────────────────────────────────────
function PlanosScreen({usuario, plano, onVoltar}) {
  const [copiado,setCopiado] = useState(false);
  const [enviado,setEnviado] = useState(false);

  const copiarPix = () => {
    if (navigator.clipboard) navigator.clipboard.writeText(PIX_CHAVE);
    setCopiado(true);
    setTimeout(()=>setCopiado(false),3000);
  };

  const avisarPagamento = async () => {
    try {
      await window.__db.collection("pagamentos_pendentes").add({
        uid:usuario.uid, email:usuario.email, nome:usuario.displayName||usuario.email,
        valor:5, criadoEm:new Date().toISOString(), status:"aguardando"
      });
      setEnviado(true);
    } catch(_) {}
  };

  return (

        <button onClick={onVoltar} style={{background:"#F2EDE8",border:"none",borderRadius:10,width:36,height:36,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",fontSize:18}}>←</button>
        <div style={{fontFamily:"'Playfair Display',serif",fontSize:18,fontWeight:700}}>Planos</div>
      </div>
      <div style={{padding:"20px 16px",display:"flex",flexDirection:"column",gap:16}}>
        {/* Free */}
        <div style={{background:"#fff",border:`2px solid ${plano==="free"?"#2C5F2E":"#E5DDD5"}`,borderRadius:16,padding:20,position:"relative"}}>
          {plano==="free" && <div style={{position:"absolute",top:-1,right:16,background:"#2C5F2E",color:"#fff",fontSize:10,fontWeight:700,fontFamily:"'DM Sans',sans-serif",padding:"3px 10px",borderRadius:"0 0 8px 8px",letterSpacing:"1px"}}>ATUAL</div>}
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:12}}>
            <div><div style={{fontFamily:"'Playfair Display',serif",fontSize:22,fontWeight:900}}>Free</div><div style={{fontFamily:"'DM Sans',sans-serif",fontSize:13,color:"#6B5744"}}>Para começar</div></div>
            <div style={{fontFamily:"'Playfair Display',serif",fontSize:28,fontWeight:900,color:"#2C5F2E"}}>R$ 0</div>
          </div>
          {[["✅","Até 2 projetos ativos"],["✅","Alertas de prazo"],["✅","Comissão e margem"],["❌","Meta mensal"],["❌","Agenda de visitas"],["❌","Relatório anual"],["❌","Projetos ilimitados"]].map(([ic,tx],i) => (
            <div key={i} style={{display:"flex",alignItems:"center",gap:8,marginBottom:6,fontFamily:"'DM Sans',sans-serif",fontSize:13,color:ic==="❌"?"#9C8B7D":"#1C1410"}}><span>{ic}</span>{tx}</div>
          ))}
        </div>

        {/* Premium */}
        <div style={{background:"linear-gradient(135deg,#1E4020,#2C5F2E)",border:"2px solid #C8A97A",borderRadius:16,padding:20,position:"relative",overflow:"hidden"}}>
          {plano==="premium" && <div style={{position:"absolute",top:-1,right:16,background:"#C8A97A",color:"#1E4020",fontSize:10,fontWeight:700,fontFamily:"'DM Sans',sans-serif",padding:"3px 10px",borderRadius:"0 0 8px 8px",letterSpacing:"1px"}}>ATUAL</div>}
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:12}}>
            <div><div style={{fontFamily:"'Playfair Display',serif",fontSize:22,fontWeight:900,color:"#fff"}}>Premium ⭐</div><div style={{fontFamily:"'DM Sans',sans-serif",fontSize:13,color:"#C8A97A"}}>Tudo ilimitado</div></div>
            <div style={{textAlign:"right"}}><div style={{fontFamily:"'Playfair Display',serif",fontSize:28,fontWeight:900,color:"#C8A97A"}}>R$ 5</div><div style={{fontFamily:"'DM Sans',sans-serif",fontSize:11,color:"rgba(255,255,255,.6)"}}>/mês</div></div>
          </div>
          {["Projetos ilimitados","Meta de comissão mensal","Agenda de visitas","Relatório anual completo","Todos os recursos Free"].map((tx,i) => (

        {/* Pix */}
        {plano !== "premium" && (
          <div style={{background:"#fff",border:"2px solid #E5DDD5",borderRadius:16,padding:20}}>

          </div>

// ── ADMIN ─────────────────────────────────────────────────────────────────────
function AdminPanel({onVoltar}) {
  const [clientes,setClientes]   = useState([]);
  const [pendentes,setPendentes] = useState([]);
  const [loading,setLoading]     = useState(true);
  const [tab,setTab]             = useState("pendentes");

  useEffect(() => {
    const u1 = window.__db.collection("pagamentos_pendentes").where("status","==","aguardando").onSnapshot(s => setPendentes(s.docs.map(d=>({id:d.id,...d.data()}))));
    const u2 = window.__db.collection("users").onSnapshot(s => { setClientes(s.docs.map(d=>({id:d.id,...d.data()}))); setLoading(false); });
    return () => { u1(); u2(); };
  },[]);

  const diasRestantes = (venc) => venc ? Math.ceil((new Date(venc)-new Date())/86400000) : null;

  const liberarPremium = async (p) => {
    const agora = new Date();
    const venc  = new Date(agora); venc.setDate(venc.getDate()+30);
    await window.__db.collection("users").doc(p.uid).update({plano:"premium",planoAtualizadoEm:agora.toISOString(),planoVencimento:venc.toISOString()});
    if (p.id) await window.__db.collection("pagamentos_pendentes").doc(p.id).update({status:"aprovado",aprovadoEm:agora.toISOString()});
  };

  const revogarPremium = async (uid) => {
    if (!window.confirm("Revogar Premium?")) return;
    await window.__db.collection("users").doc(uid).update({plano:"free",planoVencimento:null});
  };

  const premiums = clientes.filter(c=>c.plano==="premium");
  const frees    = clientes.filter(c=>c.plano!=="premium");

  return (
    <div style={{minHeight:"100vh",background:"#F2EDE8",paddingBottom:40}} className="card-in">
      <div style={{background:"linear-gradient(135deg,#1E4020,#2C5F2E)",padding:"16px 20px",display:"flex",alignItems:"center",gap:12}}>
        <button onClick={onVoltar} style={{background:"rgba(255,255,255,.15)",border:"none",borderRadius:10,width:36,height:36,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",fontSize:18,color:"#fff"}}>←</button>
        <div style={{flex:1}}>
          <div style={{fontFamily:"'Playfair Display',serif",fontSize:18,fontWeight:700,color:"#fff"}}>Painel Admin</div>
        </div>
        {pendentes.length>0 && <div style={{background:"#DC2626",color:"#fff",borderRadius:20,padding:"4px 12px",fontSize:12,fontWeight:700,fontFamily:"'DM Sans',sans-serif"}}>🔔 {pendentes.length}</div>}
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,padding:"16px 16px 0"}}>
        {[{l:"Total",v:clientes.length,c:"#1C1410"},{l:"Premium ⭐",v:premiums.length,c:"#C8A97A"},{l:"Free",v:frees.length,c:"#2C5F2E"}].map((s,i) => (
          <div key={i} style={{background:"#fff",borderRadius:12,padding:"12px 10px",textAlign:"center",border:"1px solid #E5DDD5"}}>
            <div className="section-label">{s.l}</div>
            <div style={{fontFamily:"'Playfair Display',serif",fontSize:22,fontWeight:900,color:s.c}}>{s.v}</div>
          </div>
        ))}
      </div>
      <div style={{display:"flex",background:"#fff",margin:"16px 0 0",borderBottom:"1px solid #EDE8E3"}}>
        {[["pendentes",`🔔 (${pendentes.length})`],["todos","👥 Clientes"],["premium","⭐ Premium"]].map(([k,l]) => (
          <button key={k} className={`tab-btn ${tab===k?"active":""}`} style={{fontSize:12,padding:"10px 4px"}} onClick={()=>setTab(k)}>{l}</button>
        ))}
      </div>
      <div style={{padding:16,display:"flex",flexDirection:"column",gap:10}}>
        {loading && <div style={{textAlign:"center",padding:40,color:"#9C8B7D",fontFamily:"'DM Sans',sans-serif"}}>Carregando...</div>}

        {tab==="pendentes" && (pendentes.length===0
          ? <div style={{textAlign:"center",padding:40}}><div style={{fontSize:40,marginBottom:8}}>✅</div><div style={{fontFamily:"'DM Sans',sans-serif",color:"#9C8B7D"}}>Nenhum pagamento pendente</div></div>
          : pendentes.map(p => (
            <div key={p.id} style={{background:"#fff",borderRadius:14,padding:"14px 16px",border:"2px solid #F59E0B"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:8}}>
                <div><div style={{fontFamily:"'DM Sans',sans-serif",fontWeight:700,fontSize:14}}>{p.nome}</div><div style={{fontFamily:"'DM Sans',sans-serif",fontSize:12,color:"#6B5744"}}>{p.email}</div></div>
                <div style={{background:"#FEF3C7",borderRadius:8,padding:"4px 10px",fontFamily:"'DM Sans',sans-serif",fontSize:12,fontWeight:700,color:"#B45309"}}>R$ {p.valor},00</div>
              </div>
              <div style={{fontFamily:"'DM Sans',sans-serif",fontSize:11,color:"#9C8B7D",marginBottom:10}}>📅 {new Date(p.criadoEm).toLocaleDateString("pt-BR")}</div>
              <button onClick={()=>liberarPremium(p)} className="btn-green" style={{fontSize:14}}>⭐ Liberar Premium</button>
            </div>
          ))
        )}

        {tab==="todos" && clientes.map(c => (
          <div key={c.id} style={{background:"#fff",borderRadius:14,padding:"14px 16px",border:"1px solid #E5DDD5",display:"flex",alignItems:"center",gap:12}}>
            <div style={{width:40,height:40,background:c.plano==="premium"?"linear-gradient(135deg,#1E4020,#2C5F2E)":"#F2EDE8",borderRadius:10,display:"flex",alignItems:"center",justifyContent:"center",fontSize:18,flexShrink:0}}>{c.plano==="premium"?"⭐":"👤"}</div>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontFamily:"'DM Sans',sans-serif",fontWeight:700,fontSize:14,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{c.nome||c.email}</div>
              <div style={{fontFamily:"'DM Sans',sans-serif",fontSize:11,color:"#9C8B7D",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{c.email}</div>
            </div>
            {c.plano==="premium"
              ? <button onClick={()=>revogarPremium(c.id)} style={{background:"#FEE2E2",color:"#DC2626",border:"none",borderRadius:8,padding:"6px 10px",fontSize:11,fontWeight:700,cursor:"pointer",fontFamily:"'DM Sans',sans-serif"}}>Revogar</button>
              : <button onClick={()=>liberarPremium({uid:c.id,id:null})} style={{background:"#D1FAE5",color:"#065F46",border:"none",borderRadius:8,padding:"6px 10px",fontSize:11,fontWeight:700,cursor:"pointer",fontFamily:"'DM Sans',sans-serif"}}>→ Premium</button>
            }
          </div>
        ))}

        {tab==="premium" && (premiums.length===0
          ? <div style={{textAlign:"center",padding:40}}><div style={{fontSize:40,marginBottom:8}}>⭐</div><div style={{fontFamily:"'DM Sans',sans-serif",color:"#9C8B7D"}}>Nenhum cliente Premium ainda</div></div>
          : premiums.map(c => {
            const d = diasRestantes(c.planoVencimento);
            const exp   = d!==null && d<0;
            const vend  = d!==null && d<=5 && d>=0;
            return (
              <div key={c.id} style={{background:exp?"#FEF2F2":vend?"#FFFBEB":"linear-gradient(135deg,#1E4020,#2C5F2E)",borderRadius:14,padding:"14px 16px",border:exp?"2px solid #EF4444":vend?"2px solid #F59E0B":"none"}}>
                <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:d!==null?8:0}}>
                  <div style={{width:40,height:40,background:exp?"#FEE2E2":vend?"#FEF3C7":"rgba(200,169,122,.2)",borderRadius:10,display:"flex",alignItems:"center",justifyContent:"center",fontSize:20,flexShrink:0}}>{exp?"⚠️":vend?"🕐":"⭐"}</div>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontFamily:"'DM Sans',sans-serif",fontWeight:700,fontSize:14,color:exp?"#991B1B":vend?"#92400E":"#fff",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{c.nome||c.email}</div>
                    <div style={{fontFamily:"'DM Sans',sans-serif",fontSize:11,color:exp?"#B91C1C":vend?"#B45309":"#C8A97A"}}>{c.email}</div>
                  </div>
                  <button onClick={()=>revogarPremium(c.id)} style={{background:exp?"#DC2626":vend?"#D97706":"rgba(220,38,38,.2)",color:exp||vend?"#fff":"#FCA5A5",border:"none",borderRadius:8,padding:"6px 10px",fontSize:11,fontWeight:700,cursor:"pointer",fontFamily:"'DM Sans',sans-serif",flexShrink:0}}>Revogar</button>
                </div>
                {d!==null && (
                  <div style={{background:exp?"rgba(220,38,38,.1)":vend?"rgba(217,119,6,.1)":"rgba(255,255,255,.1)",borderRadius:8,padding:"8px 12px",marginBottom:6}}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                      <div style={{fontFamily:"'DM Sans',sans-serif",fontSize:11,color:exp?"#DC2626":vend?"#D97706":"rgba(255,255,255,.7)"}}>📅 Vence: {c.planoVencimento?new Date(c.planoVencimento).toLocaleDateString("pt-BR"):"—"}</div>
                      <div style={{fontFamily:"'DM Sans',sans-serif",fontSize:12,fontWeight:700,color:exp?"#DC2626":vend?"#D97706":"#C8A97A"}}>{exp?`⚠️ Expirado há ${Math.abs(d)}d`:d===0?"⚠️ Vence hoje!":`${d} dias restantes`}</div>
                    </div>
                    <div style={{height:4,background:exp?"rgba(220,38,38,.2)":vend?"rgba(217,119,6,.2)":"rgba(255,255,255,.15)",borderRadius:2,overflow:"hidden",marginTop:6}}>
                      <div style={{height:"100%",width:`${Math.max(0,Math.min(100,Math.round((d/30)*100)))}%`,background:exp?"#DC2626":vend?"#F59E0B":"#C8A97A",borderRadius:2}}/>
                    </div>
                  </div>
                )}
                <button onClick={()=>liberarPremium({uid:c.id,id:null})} style={{width:"100%",background:exp?"#2C5F2E":vend?"#D97706":"rgba(200,169,122,.15)",color:exp||vend?"#fff":"#C8A97A",border:`1px solid ${exp?"#2C5F2E":vend?"#D97706":"rgba(200,169,122,.3)"}`,borderRadius:8,padding:7,fontSize:11,fontWeight:700,cursor:"pointer",fontFamily:"'DM Sans',sans-serif"}}>🔄 {exp?"Reativar Premium":"Renovar +30 dias"}</button>
              </div>
            );
          })
        )}
      </div>
    </div>
  );
}

// ── APP PRINCIPAL ─────────────────────────────────────────────────────────────
function App() {
  const [usuario,setUsuario]   = useState(null);
  const [authReady,setAuthReady] = useState(false);
  const [plano,setPlano]       = useState("free");
  const [projects,setProjects] = useState([]);
  const [saving,setSaving]     = useState(false);
  const [view,setView]         = useState("lista");
  const [filter,setFilter]     = useState("todos");
  const [activeId,setActiveId] = useState(null);
  const [form,setForm]         = useState(FORM0);
  const [editId,setEditId]     = useState(null);
  const [dismissed,setDismissed] = useState([]);
  const [tab,setTab]           = useState("ativos");
  const [meta,setMeta]         = useState(0);
  const [metaInput,setMetaInput] = useState("");
  const [metaEdit,setMetaEdit] = useState(false);
  const [anoRel,setAnoRel]     = useState(new Date().getFullYear());
  const [agendamentos,setAgendamentos] = useState([]);
  const [agendaForm,setAgendaForm] = useState({tipo:"medicao",data:"",hora:"",projeto:"",obs:""});
  const [agendaModal,setAgendaModal] = useState(false);
  const [agendaEdit,setAgendaEdit]   = useState(null);
  const [agendaMes,setAgendaMes]     = useState(new Date().getMonth());
  const [agendaAno,setAgendaAno]     = useState(new Date().getFullYear());
  const unsubRef = useRef(null);
  const unsubAgenda = useRef(null);

  const isAdmin   = usuario?.email === ADMIN_EMAIL;
  const isPremium = plano === "premium" || isAdmin;

  useEffect(() => {
    const unsub = window.__auth.onAuthStateChanged(user => {
      if (user) { setUsuario(user); loadUserData(user); }
      else { setUsuario(null); setProjects([]); setMeta(0); setPlano("free"); }
      setAuthReady(true);
    });
    return () => unsub();
  }, []);

  const loadUserData = (user) => {
    if (unsubRef.current) unsubRef.current();
    if (unsubAgenda.current) unsubAgenda.current();
    unsubRef.current = window.__db.collection("users").doc(user.uid).onSnapshot(snap => {
      if (snap.exists) {
        const d = snap.data();
        setProjects(d.projects||[]);
        setMeta(d.meta||0);
        setPlano(d.plano||"free");
      }
    });
    unsubAgenda.current = window.__db.collection("users").doc(user.uid).collection("agendamentos").onSnapshot(snap => {
      setAgendamentos(snap.docs.map(d=>({id:d.id,...d.data()})));
    });
  };

  const persist = useCallback(async (list) => {
    if (!usuario) return;
    if (!isPremium) {
      const atv = list.filter(p=>p.status!=="concluido");
      if (atv.length > 2) { alert("Plano Free: máximo 2 projetos ativos.\nFaça upgrade para Premium! ⭐"); return; }
    }
    setSaving(true); setProjects(list);
    try { await window.__db.collection("users").doc(usuario.uid).update({projects:list}); } catch(_) {}
    setSaving(false);
  }, [usuario, isPremium]);

  const saveMeta = async (val) => {
    if (!isPremium) { setView("planos"); return; }
    const v = parseFloat(val)||0;
    setMeta(v); setMetaEdit(false);
    try { await window.__db.collection("users").doc(usuario.uid).update({meta:v}); } catch(_) {}
  };

  const saveAgenda = async () => {
    if (!agendaForm.data||!agendaForm.hora) return;
    const data = {...agendaForm, criadoEm:new Date().toISOString()};
    const col = window.__db.collection("users").doc(usuario.uid).collection("agendamentos");
    if (agendaEdit) await col.doc(agendaEdit).set(data);
    else await col.add(data);
    setAgendaModal(false); setAgendaEdit(null);
    setAgendaForm({tipo:"medicao",data:"",hora:"",projeto:"",obs:""});
  };

  const deleteAgenda = async (id) => {
    if (!window.confirm("Excluir agendamento?")) return;
    await window.__db.collection("users").doc(usuario.uid).collection("agendamentos").doc(id).delete();
  };

  const handleLogout = async () => {
    if (unsubRef.current) unsubRef.current();
    if (unsubAgenda.current) unsubAgenda.current();
    await window.__auth.signOut();
    setView("lista");
  };

  // ── Dados derivados ──
  const ativos     = projects.filter(p=>p.status!=="concluido");
  const concluidos = projects.filter(p=>p.status==="concluido");
  const lista      = tab==="ativos" ? ativos : concluidos;
  const filtered   = filter==="todos" ? lista : lista.filter(p=>p.status===filter);
  const sorted     = [...filtered].sort((a,b)=>PRAZO(a.prazo).d-PRAZO(b.prazo).d);

  const totalVendas    = ativos.reduce((s,p)=>s+p.valor,0);
  const totalRecebido  = ativos.reduce((s,p)=>s+p.pago,0);
  const comissaoTotal  = ativos.reduce((s,p)=>s+p.valor*(p.comissaoPct||5)/100,0);
  const comissaoPaga   = ativos.reduce((s,p)=>s+p.pago*(p.comissaoPct||5)/100,0);
  const pctComissao    = comissaoTotal>0 ? Math.round((comissaoPaga/comissaoTotal)*100) : 0;
  const comissaoConcl  = concluidos.reduce((s,p)=>s+p.valor*(p.comissaoPct||5)/100,0);
  const comissaoAtivos = ativos.reduce((s,p)=>s+p.pago*(p.comissaoPct||5)/100,0);
  const totalFabrica   = projects.reduce((s,p)=>s+(p.valorFabrica||0),0);
  const margemAtivos   = ativos.reduce((s,p)=>s+(p.valor-(p.valorFabrica||0)),0);
  const margemConcl    = concluidos.reduce((s,p)=>s+(p.valor-(p.valorFabrica||0)),0);

  // Meta mensal (mês atual pelo prazo)
  const now = new Date();
  const mesNome = MESES_ABREV[now.getMonth()];
  const comissaoMesAtual = projects.reduce((s,p) => {
    if (!p.prazo) return s;
    const d = new Date(p.prazo);
    if (d.getMonth()!==now.getMonth()||d.getFullYear()!==now.getFullYear()) return s;
    return p.status==="concluido"
      ? s + p.valor*(p.comissaoPct||5)/100
      : s + p.pago*(p.comissaoPct||5)/100;
  }, 0);
  const pctMeta      = meta>0 ? Math.min(Math.round((comissaoMesAtual/meta)*100),100) : 0;
  const metaRestante = meta>0 ? Math.max(meta-comissaoMesAtual,0) : 0;
  const metaAtingida = meta>0 && comissaoMesAtual>=meta;

  // Relatório anual
  const dadosMensais = MESES_ABREV.map((mes,idx) => {
    const dC = concluidos.filter(p=>{ if(!p.prazo)return false; const d=new Date(p.prazo); return d.getFullYear()===anoRel&&d.getMonth()===idx; });
    const dA = ativos.filter(p=>{ if(!p.prazo)return false; const d=new Date(p.prazo); return d.getFullYear()===anoRel&&d.getMonth()===idx; });
    const cc = dC.reduce((s,p)=>s+p.valor*(p.comissaoPct||5)/100,0);
    const ca = dA.reduce((s,p)=>s+p.pago*(p.comissaoPct||5)/100,0);
    return {mes,idx,total:cc+ca,comissaoConcl:cc,comissaoAtiv:ca,projetos:dC.length+dA.length};
  });
  const maxMensal = Math.max(...dadosMensais.map(d=>d.total),1);
  const totalAno  = dadosMensais.reduce((s,d)=>s+d.total,0);
  const melhorMes = dadosMensais.reduce((a,b)=>b.total>a.total?b:a,dadosMensais[0]);
  const criticos  = ativos.filter(p=>PRAZO(p.prazo).pulse&&!dismissed.includes(p.id));
  const activeProject = projects.find(p=>p.id===activeId);

  const openNew    = () => { if(!isPremium&&ativos.length>=2){setView("planos");return;} setEditId(null);setForm(FORM0);setView("form"); };
  const openEdit   = (p) => { setEditId(p.id); setForm({...p,valor:String(p.valor),pago:String(p.pago),valorFabrica:String(p.valorFabrica||""),comissaoPct:String(p.comissaoPct||5)}); setView("form"); };
  const openDetail = (id) => { setActiveId(id); setView("detalhe"); };
  const goBack     = () => { setView("lista"); setActiveId(null); };

  const saveForm = () => {
    if (!form.nome.trim()||!form.cliente.trim()||!form.prazo) return;
    const data = {
      ...form,
      id: editId||uid(),
      valor: parseFloat(form.valor)||0,
      pago: parseFloat(form.pago)||0,
      valorFabrica: parseFloat(form.valorFabrica)||0,
      comissaoPct: parseFloat(form.comissaoPct)||5,
    };
    persist(editId ? projects.map(p=>p.id===editId?data:p) : [...projects,data]);
    goBack();
  };

  const remove   = (id) => { persist(projects.filter(p=>p.id!==id)); goBack(); };
  const concluir = (id) => { persist(projects.map(p=>p.id===id?{...p,status:"concluido"}:p)); goBack(); };
  const reabrir  = (id) => { persist(projects.map(p=>p.id===id?{...p,status:"em_projeto"}:p)); };
  const ff = (key) => (e) => setForm(f=>({...f,[key]:e.target.value}));

  if (!authReady) return (
    <div style={{minHeight:"100vh",background:"#2C5F2E",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:12}}>
      <div style={{fontSize:48}}>🏠</div>
      <div style={{fontFamily:"'DM Sans',sans-serif",color:"rgba(255,255,255,.8)",fontSize:15}}>Carregando...</div>
    </div>
  );

  if (!usuario) return <AuthScreen onLogin={u=>{setUsuario(u);loadUserData(u);}}/>;
  if (view==="planos") return <PlanosScreen usuario={usuario} plano={plano} onVoltar={goBack}/>;
  if (view==="admin" && isAdmin) return <AdminPanel onVoltar={goBack}/>;

  const nomeUsuario = usuario.displayName||usuario.email.split("@")[0];

  return (
    <div style={{minHeight:"100vh",background:"#F2EDE8",color:"#1C1410",position:"relative"}}>

      {/* ── LISTA ── */}
      {view==="lista" && (
        <div style={{paddingBottom:90}}>
          {/* Header */}
          <div style={{background:"#fff",padding:"16px 20px 0",boxShadow:"0 2px 8px rgba(0,0,0,.06)"}}>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14}}>
              <div style={{display:"flex",alignItems:"center",gap:10}}>
                <div style={{width:38,height:38,background:"#2C5F2E",borderRadius:10,display:"flex",alignItems:"center",justifyContent:"center",fontSize:20}}>🏠</div>
                <div>
                  <div style={{fontFamily:"'Playfair Display',serif",fontSize:20,fontWeight:900,lineHeight:1.1}}>Móveis<span style={{color:"#2C5F2E"}}>Studio</span></div>
                  <div style={{display:"flex",alignItems:"center",gap:6}}>
                    <div style={{fontSize:10,color:"#9C8B7D",fontFamily:"'DM Sans',sans-serif"}}>👤 {nomeUsuario}</div>
                    {isPremium&&!isAdmin && <span style={{background:"linear-gradient(135deg,#1E4020,#2C5F2E)",color:"#C8A97A",fontSize:9,fontWeight:700,padding:"2px 6px",borderRadius:6,fontFamily:"'DM Sans',sans-serif"}}>⭐ PREMIUM</span>}
                    {isAdmin && <span style={{background:"#DC2626",color:"#fff",fontSize:9,fontWeight:700,padding:"2px 6px",borderRadius:6,fontFamily:"'DM Sans',sans-serif"}}>👑 ADMIN</span>}
                  </div>
                </div>
              </div>
              <div style={{display:"flex",alignItems:"center",gap:6}}>
                {saving && <div style={{width:16,height:16,border:"2px solid #D5C9BF",borderTopColor:"#2C5F2E",borderRadius:"50%",animation:"spin .6s linear infinite"}}/>}
                {criticos.length>0&&!saving && <div style={{background:"#DC2626",color:"#fff",borderRadius:20,padding:"4px 8px",fontSize:11,fontWeight:700,fontFamily:"'DM Sans',sans-serif"}}>🚨{criticos.length}</div>}
                {isAdmin && <button onClick={()=>setView("admin")} style={{background:"#FEF3C7",border:"none",borderRadius:8,padding:"6px 8px",fontSize:12,fontWeight:700,color:"#B45309",cursor:"pointer",fontFamily:"'DM Sans',sans-serif"}}>👑</button>}
                <button onClick={handleLogout} style={{background:"#FEE2E2",border:"none",borderRadius:8,padding:"6px 8px",fontSize:12,fontWeight:700,color:"#DC2626",cursor:"pointer",fontFamily:"'DM Sans',sans-serif"}}>Sair</button>
              </div>
            </div>

                      const dataFmt = new Date(a.data+"T00:00:00").toLocaleDateString("pt-BR",{weekday:"short",day:"2-digit",month:"short"});
                      const ehHoje2 = a.data===hoje.toISOString().split("T")[0];
                      return (
                        <div key={a.id} style={{background:"#fff",borderRadius:14,padding:"14px 16px",marginBottom:10,border:`2px solid ${ehHoje2?t.border:"#E5DDD5"}`,display:"flex",gap:12,alignItems:"flex-start"}}>
                          <div style={{width:44,height:44,background:t.bg,borderRadius:10,display:"flex",alignItems:"center",justifyContent:"center",fontSize:20,flexShrink:0,border:`1.5px solid ${t.border}`}}>{t.icon}</div>
                          <div style={{flex:1,minWidth:0}}>
                            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:8}}>
                              <div>
                                <div style={{fontFamily:"'DM Sans',sans-serif",fontWeight:700,fontSize:14,color:t.color}}>{t.label}</div>
                                {a.projeto && <div style={{fontFamily:"'DM Sans',sans-serif",fontSize:12,color:"#6B5744",marginTop:1}}>📐 {a.projeto}</div>}
                              </div>
                              <div style={{textAlign:"right",flexShrink:0}}>
                                <div style={{fontFamily:"'DM Sans',sans-serif",fontSize:12,fontWeight:700,color:"#1C1410"}}>{a.hora}</div>
                                <div style={{fontFamily:"'DM Sans',sans-serif",fontSize:11,color:"#9C8B7D"}}>{dataFmt}</div>
                              </div>
                            </div>
                            {a.obs && <div style={{fontFamily:"'DM Sans',sans-serif",fontSize:12,color:"#9C8B7D",marginTop:6,background:"#F9F7F5",borderRadius:6,padding:"4px 8px"}}>{a.obs}</div>}
                            {ehHoje2 && <div style={{background:t.bg,border:`1px solid ${t.border}`,borderRadius:6,padding:"3px 8px",marginTop:6,display:"inline-block",fontFamily:"'DM Sans',sans-serif",fontSize:10,fontWeight:700,color:t.color}}>HOJE</div>}
                          </div>
                          <div style={{display:"flex",flexDirection:"column",gap:4,flexShrink:0}}>
                            <button onClick={()=>{setAgendaEdit(a.id);setAgendaForm({tipo:a.tipo,data:a.data,hora:a.hora,projeto:a.projeto||"",obs:a.obs||""});setAgendaModal(true);}} style={{background:"#F2EDE8",border:"none",borderRadius:8,width:30,height:30,cursor:"pointer",fontSize:14,display:"flex",alignItems:"center",justifyContent:"center"}}>✏️</button>
                            <button onClick={()=>deleteAgenda(a.id)} style={{background:"#FEE2E2",border:"none",borderRadius:8,width:30,height:30,cursor:"pointer",fontSize:14,display:"flex",alignItems:"center",justifyContent:"center"}}>🗑</button>
                          </div>
                        </div>
                      );
                    })
                }
              </div>
            </div>

            {/* Modal */}
            {agendaModal && (
              <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.5)",zIndex:100,display:"flex",alignItems:"flex-end",justifyContent:"center"}} onClick={e=>{if(e.target===e.currentTarget){setAgendaModal(false);setAgendaEdit(null);}}}>
                <div style={{background:"#fff",borderRadius:"20px 20px 0 0",padding:"24px 20px",width:"100%",maxWidth:480,maxHeight:"85vh",overflowY:"auto"}} className="card-in">
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
                    <div style={{fontFamily:"'Playfair Display',serif",fontSize:18,fontWeight:700}}>{agendaEdit?"Editar":"Novo"} Agendamento</div>
                    <button onClick={()=>{setAgendaModal(false);setAgendaEdit(null);}} style={{background:"#F2EDE8",border:"none",borderRadius:8,width:32,height:32,cursor:"pointer",fontSize:18}}>✕</button>
                  </div>
                  <div style={{display:"flex",flexDirection:"column",gap:16}}>
                    <div>
                      <div className="section-label">Tipo *</div>
                      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
                        {Object.entries(TIPOS_AGENDA).map(([k,t]) => (
                          <button key={k} onClick={()=>setAgendaForm(f=>({...f,tipo:k}))} style={{padding:"10px 8px",borderRadius:10,border:`2px solid ${agendaForm.tipo===k?t.color:"#E5DDD5"}`,background:agendaForm.tipo===k?t.bg:"#fff",cursor:"pointer",display:"flex",alignItems:"center",gap:6,fontFamily:"'DM Sans',sans-serif",fontSize:13,fontWeight:agendaForm.tipo===k?700:400,color:agendaForm.tipo===k?t.color:"#6B5744",transition:"all .2s"}}>
                            <span style={{fontSize:16}}>{t.icon}</span>{t.label}
                          </button>
                        ))}
                      </div>
                    </div>
                    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
                      <div><div className="section-label">Data *</div><input type="date" value={agendaForm.data} onChange={e=>setAgendaForm(f=>({...f,data:e.target.value}))}/></div>
                      <div><div className="section-label">Horário *</div><input type="time" value={agendaForm.hora} onChange={e=>setAgendaForm(f=>({...f,hora:e.target.value}))}/></div>
                    </div>
                    <div>
                      <div className="section-label">Projeto (opcional)</div>
                      <select value={agendaForm.projeto} onChange={e=>setAgendaForm(f=>({...f,projeto:e.target.value}))}>
                        <option value="">Selecionar projeto...</option>
                        {projects.map(p => <option key={p.id} value={p.nome}>{p.nome} — {p.cliente}</option>)}
                      </select>
                    </div>
                    <div><div className="section-label">Observações</div><textarea rows={2} value={agendaForm.obs} onChange={e=>setAgendaForm(f=>({...f,obs:e.target.value}))} placeholder="Endereço, contato..." style={{resize:"none"}}/></div>
                    <button className="btn-green" onClick={saveAgenda}>{agendaEdit?"✅ Salvar Alterações":"✅ Criar Agendamento"}</button>
                  </div>
                </div>
              </div>
            )}
            <button className="fab" onClick={()=>{setAgendaEdit(null);setAgendaForm({tipo:"medicao",data:"",hora:"",projeto:"",obs:""});setAgendaModal(true);}}>＋</button>
          </div>
        );
      })()}

      {view==="lista" && tab==="ativos" && <button className="fab" onClick={openNew}>＋</button>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
